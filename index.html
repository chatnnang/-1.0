<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>얼마썼냥 1.2 (Maintenance & UX Fix)</title>

  <meta property="og:title" content="🐱 얼마썼냥 1.2">
  <meta property="og:description" content="리듬게임 지출 기록 및 전적 프로필">
  <meta property="og:type" content="website">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 안정화된 Firebase v8 SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20 font-sans overflow-x-hidden">
  
  <div class="max-w-md mx-auto p-4 space-y-4">
    <!-- 인증 바 -->
    <div id="authBar" class="bg-slate-800/90 backdrop-blur border border-slate-700 p-3 rounded-2xl flex justify-between items-center text-xs shadow-md">
      <div id="userInfo" class="flex items-center space-x-2">
        <span class="w-2.5 h-2.5 rounded-full bg-slate-500" id="statusDot"></span>
        <span id="userStatusText" class="text-slate-400 font-medium">로그인되지 않음</span>
      </div>
      <div id="authButtons">
        <button onclick="loginWithGoogle()" id="btnLogin" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl transition shadow flex gap-1 active:scale-95">구글 로그인</button>
        <button onclick="logoutGoogle()" id="btnLogout" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold px-3 py-1.5 rounded-xl transition active:scale-95">로그아웃</button>
      </div>
    </div>

    <!-- [탭 1: 지출 입력] -->
    <div id="tab-input" class="tab-content active space-y-4">
      <header class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
        <h1 class="text-lg font-bold text-slate-200">🐱 얼마썼냥</h1>
        <div class="grid grid-cols-2 gap-3 mt-3">
          <div class="bg-slate-950/60 p-3 rounded-xl"><span class="text-xs text-slate-400">오늘 지출</span><p id="todayCost" class="text-xl font-bold text-emerald-400">0원</p></div>
          <div class="bg-slate-950/60 p-3 rounded-xl"><span class="text-xs text-slate-400">오늘 판수</span><p id="todayCount" class="text-xl font-bold text-indigo-400">0판</p></div>
        </div>
      </header>

      <section class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 space-y-3">
        
        <!-- 플레이 일시 -->
        <div>
          <div class="flex justify-between items-center">
            <label class="text-xs text-slate-400 font-medium">플레이 일시</label>
            <label class="flex items-center space-x-1.5 cursor-pointer">
              <input type="checkbox" id="unknownTime" onchange="toggleTimeInput()" class="w-3.5 h-3.5 rounded border-slate-600 bg-slate-900 text-indigo-500 focus:ring-indigo-500 focus:ring-offset-slate-800">
              <span class="text-[11px] text-slate-400 font-bold">시간 모름</span>
            </label>
          </div>
          <input type="datetime-local" id="customDatetime" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 block transition-all">
          <input type="date" id="customDate" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 hidden transition-all">
        </div>

        <!-- 오락실 이름 -->
        <div>
          <label class="text-xs text-slate-400 font-medium">오락실 이름</label>
          <div class="flex gap-1.5 mt-1">
            <input type="text" id="arcadeInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm">
            <button type="button" onclick="saveFavoriteArcade()" class="bg-slate-700 text-indigo-300 font-bold px-3 py-2 rounded-xl text-sm">⭐+</button>
          </div>
          <div id="favoriteArcadeList" class="flex flex-wrap gap-1.5 mt-2"></div>
        </div>

        <!-- 💡수정됨: 플레이 게임 기본값 빈칸 처리 -->
        <div>
          <label class="text-xs text-slate-400 font-medium">플레이 게임</label>
          <input type="text" id="gameInput" list="gameList" placeholder="직접 입력하거나 목록에서 선택하세요" value="" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:border-indigo-500 focus:outline-none">
          <datalist id="gameList">
            <option value="사운드 볼텍스 (발키리)"></option>
            <option value="사운드 볼텍스 (구기체)"></option>
            <option value="비트매니아 IIDX (라이트닝)"></option>
            <option value="마이마이 DX"></option>
            <option value="츄니즘"></option>
            <option value="팝픈뮤직"></option>
            <option value="이지투아케이드"></option>
          </datalist>
        </div>

        <div>
          <label class="text-xs text-slate-400 font-medium">판당 금액 (원)</label>
          <div class="grid grid-cols-4 gap-1.5 mt-1 mb-2">
            <button type="button" onclick="setPrice(500)" class="bg-slate-700 text-xs py-1.5 rounded-lg">500</button>
            <button type="button" onclick="setPrice(1000)" class="bg-slate-700 text-xs py-1.5 rounded-lg">1000</button>
            <button type="button" onclick="setPrice(1500)" class="bg-slate-700 text-xs py-1.5 rounded-lg">1500</button>
            <button type="button" onclick="setPrice(2000)" class="bg-slate-700 text-xs py-1.5 rounded-lg">2000</button>
          </div>
          <input type="number" id="priceInput" value="1000" step="500" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-right font-bold">
        </div>

        <div>
          <label class="text-xs text-slate-400 font-medium">플레이 판수</label>
          <div class="flex items-center space-x-2 mt-1">
            <button type="button" onclick="changeCount(-1)" class="w-12 h-10 bg-slate-700 rounded-xl font-bold">-</button>
            <input type="number" id="countInput" value="1" min="1" class="w-full text-center bg-slate-900 border border-slate-700 rounded-xl h-10 font-bold">
            <button type="button" onclick="changeCount(1)" class="w-12 h-10 bg-indigo-600 rounded-xl font-bold">+</button>
          </div>
        </div>
        <button onclick="addLog()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl mt-2 active:scale-95 transition">지출 기록하기</button>
      </section>
    </div>

    <!-- [탭 2: 플레이 데이터 (점검 중)] -->
    <div id="tab-profile" class="tab-content space-y-4">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center space-y-5 shadow-lg mt-4">
        <div class="text-6xl mb-2">🛠️</div>
        <h2 class="text-xl font-black text-rose-400 tracking-wide">시스템 점검 중</h2>
        <p class="text-sm text-slate-300 leading-relaxed break-keep font-medium">
          현재 전적 데이터 연동 시스템에<br>오류가 발견되어 긴급 점검을 진행 중입니다.
        </p>
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 text-left space-y-2 mt-4">
          <p class="text-xs text-slate-400 font-bold flex items-center gap-1"><span>📌</span> 점검 내용</p>
          <p class="text-[11px] text-slate-500 leading-tight">
            공식 사이트 연동 안정성 확보 및<br>
            테스트 서버(베타) 분리 작업
          </p>
        </div>
        <p class="text-[10px] text-slate-500 font-bold">점검 중には '지출 입력'과 '통계' 등<br>기본 가계부 기능만 정상 이용 가능합니다.</p>
      </div>
    </div>

    <!-- [탭 3: 통계] -->
    <div id="tab-stats" class="tab-content space-y-4">
      <header class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
        <h1 class="text-lg font-bold text-slate-200 mb-2">📊 월별 지출 현황</h1>
        <div class="bg-slate-950/60 p-4 rounded-xl mb-4 text-center">
          <span class="text-sm text-slate-400 block mb-1">이번 달 오락실 지출</span><span id="thisMonthTotalCost" class="text-3xl font-bold text-rose-400">0원</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-xl mb-4"><canvas id="monthlyChart" height="200"></canvas></div>
      </header>
      <section class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
        <h2 class="text-sm font-bold text-slate-400 mb-3">전체 상세 기록</h2>
        <div id="fullLogList" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
      </section>
    </div>

    <!-- [탭 4: 공지] -->
    <div id="tab-notice" class="tab-content space-y-4">
      <header class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700">
        <h1 class="text-lg font-bold text-slate-200">📢 공지사항</h1>
      </header>
      <section id="noticeList" class="space-y-3"></section>
    </div>

    <!-- [탭 5: 설정] -->
    <div id="tab-settings" class="tab-content space-y-4">
      <header class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 text-center">
        <h1 class="text-lg font-bold text-slate-200">⚙️ 데이터 관리</h1>
      </header>
      <section class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 space-y-3">
        <h2 class="text-sm font-bold text-slate-400 mb-1">지출 데이터 수동 백업 및 복구</h2>
        <button onclick="exportData()" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-xl shadow-md">📥 데이터 파일 추출 (다운로드)</button>
        <div class="relative w-full">
          <input type="file" id="importFile" accept=".json" onchange="importData(event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
          <div class="w-full bg-slate-900 border border-slate-600 text-slate-300 font-bold py-3 rounded-xl text-center">📤 복구 파일 불러오기</div>
        </div>
        <button onclick="clearAllLogs()" class="w-full bg-rose-900/40 text-rose-400 border border-rose-900/50 font-bold py-3 rounded-xl mt-4">🚨 데이터 전체 초기화</button>
      </section>
    </div>
  </div>

  <nav class="fixed bottom-0 w-full max-w-md left-1/2 -translate-x-1/2 bg-slate-800 border-t border-slate-700 flex justify-between p-2 pb-safe z-[60]">
    <button onclick="switchTab('tab-profile')" id="btn-tab-profile" class="nav-btn text-slate-500 font-bold flex flex-col items-center flex-1"><span class="text-[20px] mb-0.5">🎮</span><span class="text-[10px]">데이터</span></button>
    <button onclick="switchTab('tab-input')" id="btn-tab-input" class="nav-btn text-indigo-400 font-bold flex flex-col items-center flex-1"><span class="text-[20px] mb-0.5">✍️</span><span class="text-[10px]">지출입력</span></button>
    <button onclick="switchTab('tab-stats')" id="btn-tab-stats" class="nav-btn text-slate-500 font-bold flex flex-col items-center flex-1"><span class="text-[20px] mb-0.5">📊</span><span class="text-[10px]">통계</span></button>
    <button onclick="switchTab('tab-notice')" id="btn-tab-notice" class="nav-btn text-slate-500 font-bold flex flex-col items-center flex-1"><span class="text-[20px] mb-0.5">📢</span><span class="text-[10px]">공지</span></button>
    <button onclick="switchTab('tab-settings')" id="btn-tab-settings" class="nav-btn text-slate-500 font-bold flex flex-col items-center flex-1"><span class="text-[20px] mb-0.5">⚙️</span><span class="text-[10px]">설정</span></button>
  </nav>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCjS6vsVVnscjBZufjbMcZnhGFIvyQa8VY",
      authDomain: "test-7595b.firebaseapp.com",
      projectId: "test-7595b",
      storageBucket: "test-7595b.firebasestorage.app",
      messagingSenderId: "1066933910880",
      appId: "1:1066933910880:web:a1ddbcfb455e7507c73205"
    };

    let auth, db, monthlyChartInstance;
    let currentUser = null;
    let logs = [];
    let favoriteArcades = JSON.parse(localStorage.getItem('rhythm_fav_arcades') || '["삼보", "짱오락실"]');

    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch(e) { console.warn("Firebase Init", e); }

    const NOTICES = [
      {
        tag: "점검중", tagColor: "bg-rose-600 text-white",
        title: "🛠️ 전적 데이터 연동 시스템 점검 안내",
        date: "2026.08.19",
        content: "- 현재 전적 연동 및 VF50 갱신 기능에 오류가 발생하여 긴급 점검 중입니다.\n- 안정적인 운영을 위해 '테스트 서버(베타)' 분리 작업을 진행하고 있습니다.\n- 점검 중에는 [지출 입력, 통계, 백업] 등 가계부 기능만 정상 이용하실 수 있습니다.\n\n불편을 드려 죄송합니다. 빠르게 복구하겠습니다!"
      },
      {
        tag: "안내", tagColor: "bg-slate-600 text-white",
        title: "✍️ 지출 입력 편의성 개선",
        date: "2026.08.19",
        content: "- 플레이 게임을 목록 선택뿐만 아니라 [직접 입력]할 수 있도록 변경되었습니다.\n- 플레이 시간을 정확히 모를 경우 [시간 모름] 체크박스를 눌러 날짜만 기록할 수 있습니다."
      }
    ];

    if (auth) {
      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]";
          document.getElementById('userStatusText').textContent = `${user.displayName || '유저'}님 연동됨`;
          document.getElementById('btnLogin').classList.add('hidden');
          document.getElementById('btnLogout').classList.remove('hidden');

          db.collection("users").doc(user.uid).collection("logs").orderBy("id", "desc").onSnapshot((snapshot) => {
            logs = []; snapshot.forEach((doc) => logs.push(doc.data())); renderDashboard();
            if(document.getElementById('tab-stats').classList.contains('active')) renderStats();
          });
        } else {
          currentUser = null;
          document.getElementById('statusDot').className = "w-2.5 h-2.5 rounded-full bg-slate-500";
          document.getElementById('userStatusText').textContent = "로그인되지 않음";
          document.getElementById('btnLogin').classList.remove('hidden');
          document.getElementById('btnLogout').classList.add('hidden');

          logs = JSON.parse(localStorage.getItem('rhythm_logs_v3') || '[]');
          renderDashboard();
          if(document.getElementById('tab-stats').classList.contains('active')) renderStats();
        }
      });
    }

    function loginWithGoogle() {
      if (!auth) return alert("Firebase 인증 준비 중입니다.");
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch((error) => alert("로그인 오류: " + error.message));
    }
    function logoutGoogle() { if (auth) auth.signOut(); }

    function toggleTimeInput() {
      const isUnknown = document.getElementById('unknownTime').checked;
      const dtInput = document.getElementById('customDatetime');
      const dInput = document.getElementById('customDate');
      
      if (isUnknown) {
        dtInput.classList.add('hidden'); dtInput.classList.remove('block');
        dInput.classList.remove('hidden'); dInput.classList.add('block');
        dInput.value = dtInput.value.split('T')[0] || new Date().toISOString().split('T')[0];
      } else {
        dtInput.classList.remove('hidden'); dtInput.classList.add('block');
        dInput.classList.add('hidden'); dInput.classList.remove('block');
        if(dInput.value) {
          dtInput.value = dInput.value + 'T' + new Date().toTimeString().slice(0,5);
        }
      }
    }

    function resetDatetimeInput() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      const iso = now.toISOString();
      document.getElementById('customDatetime').value = iso.slice(0, 16);
      document.getElementById('customDate').value = iso.split('T')[0];
      document.getElementById('unknownTime').checked = false;
      toggleTimeInput();
    }
    resetDatetimeInput();

    function setPrice(amount) { document.getElementById('priceInput').value = amount; }
    function changeCount(val) {
      const input = document.getElementById('countInput');
      const next = parseInt(input.value || 1) + val;
      if (next >= 1) input.value = next;
    }

    function renderFavoriteArcades() {
      const container = document.getElementById('favoriteArcadeList');
      container.innerHTML = '';
      favoriteArcades.forEach(arc => {
        const chip = document.createElement('div');
        chip.className = 'flex items-center bg-slate-700/80 hover:bg-slate-600 text-slate-200 text-xs px-2.5 py-1 rounded-lg cursor-pointer transition';
        chip.innerHTML = `<span onclick="selectArcade('${arc}')" class="font-medium mr-1.5">📍 ${arc}</span><span onclick="removeFavoriteArcade('${arc}')" class="text-slate-400 hover:text-rose-400 text-xs font-bold">×</span>`;
        container.appendChild(chip);
      });
    }
    function selectArcade(name) { document.getElementById('arcadeInput').value = name; }
    function saveFavoriteArcade() {
      const name = document.getElementById('arcadeInput').value.trim();
      if (!name) return;
      if (!favoriteArcades.includes(name)) { favoriteArcades.push(name); localStorage.setItem('rhythm_fav_arcades', JSON.stringify(favoriteArcades)); renderFavoriteArcades(); }
    }
    function removeFavoriteArcade(name) {
      favoriteArcades = favoriteArcades.filter(a => a !== name);
      localStorage.setItem('rhythm_fav_arcades', JSON.stringify(favoriteArcades)); renderFavoriteArcades();
    }
    renderFavoriteArcades();

    async function addLog() {
      const isUnknown = document.getElementById('unknownTime').checked;
      let targetDate, timeStrVal;
      
      // 입력값이 완전 비어있을 경우 경고창
      const gameInputVal = document.getElementById('gameInput').value.trim();
      if (!gameInputVal) {
        return alert("플레이한 게임의 이름을 입력해 주세요!");
      }

      if (isUnknown) {
        const dateVal = document.getElementById('customDate').value;
        targetDate = dateVal ? new Date(dateVal + 'T00:00:00') : new Date();
        timeStrVal = '시간 모름';
      } else {
        const dtVal = document.getElementById('customDatetime').value;
        targetDate = dtVal ? new Date(dtVal) : new Date();
        timeStrVal = targetDate.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      }

      const log = {
        id: Date.now(), 
        date: targetDate.toISOString(),
        dateStr: targetDate.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }),
        timeStr: timeStrVal,
        arcade: document.getElementById('arcadeInput').value.trim() || '이름 모를 오락실',
        game: gameInputVal,
        mode: '일반',
        unitPrice: parseInt(document.getElementById('priceInput').value || 0), 
        count: parseInt(document.getElementById('countInput').value || 1),
      };
      log.totalCost = log.unitPrice * log.count;

      if (currentUser && db) await db.collection("users").doc(currentUser.uid).collection("logs").doc(String(log.id)).set(log);
      else { logs.unshift(log); localStorage.setItem('rhythm_logs_v3', JSON.stringify(logs)); renderDashboard(); }
      
      document.getElementById('countInput').value = 1; 
      
      // 입력 완료 후 게임 입력칸도 비워주기
      document.getElementById('gameInput').value = '';
      resetDatetimeInput(); 
      alert('가계부 기록이 완료되었습니다!');
    }

    async function deleteLog(id) {
      if(confirm('삭제할까요?')) {
        if (currentUser && db) await db.collection("users").doc(currentUser.uid).collection("logs").doc(String(id)).delete();
        else { logs = logs.filter(l => l.id !== id); localStorage.setItem('rhythm_logs_v3', JSON.stringify(logs)); renderDashboard(); renderStats(); }
      }
    }

    function renderDashboard() {
      const todayStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
      let todayCost = 0, todayCount = 0;
      logs.forEach(log => { if (log.dateStr === todayStr) { todayCost += log.totalCost; todayCount += log.count; } });
      document.getElementById('todayCost').textContent = `${todayCost.toLocaleString()}원`;
      document.getElementById('todayCount').textContent = `${todayCount}판`;
    }

    function renderStats() {
      const listEl = document.getElementById('fullLogList'); listEl.innerHTML = '';
      const now = new Date(); const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      let thisMonthTotal = 0;

      if (logs.length === 0) {
        listEl.innerHTML = '<div class="text-center py-8 text-slate-500 text-sm">기록이 없습니다.</div>';
        document.getElementById('thisMonthTotalCost').textContent = '0원';
        if(monthlyChartInstance) monthlyChartInstance.destroy();
        return;
      }

      const monthlyCosts = {};
      logs.forEach(log => {
        const monthKey = log.date.substring(0, 7);
        monthlyCosts[monthKey] = (monthlyCosts[monthKey] || 0) + log.totalCost;
        if (monthKey === currentMonthStr) thisMonthTotal += log.totalCost;
      });
      document.getElementById('thisMonthTotalCost').textContent = `${thisMonthTotal.toLocaleString()}원`;

      const sortedMonths = Object.keys(monthlyCosts).sort();
      const chartLabels = sortedMonths.map(m => { const [year, month] = m.split('-'); return `${year.slice(2)}년 ${parseInt(month)}월`; });
      const chartData = sortedMonths.map(m => monthlyCosts[m]);

      const ctx = document.getElementById('monthlyChart').getContext('2d');
      if (monthlyChartInstance) monthlyChartInstance.destroy();
      monthlyChartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels: chartLabels, datasets: [{ data: chartData, backgroundColor: '#4f46e5', borderRadius: 6 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#cbd5e1' } } } }
      });

      logs.forEach(log => {
        const card = document.createElement('div'); card.className = 'bg-slate-900 border border-slate-700/60 p-3 rounded-xl flex justify-between items-center';
        let timeDisplay = log.timeStr && log.timeStr !== '시간 모름' ? `<span class="text-[10px] text-slate-500 ml-1">${log.timeStr}</span>` : '';
        
        card.innerHTML = `<div class="w-full"><div class="flex justify-between items-center mb-1"><span class="text-xs text-slate-400">${log.dateStr}${timeDisplay} <b class="text-indigo-300 ml-1">${log.arcade}</b></span><button onclick="deleteLog(${log.id})" class="text-slate-500 hover:text-rose-400 text-xs px-2 py-1 rounded bg-slate-800 transition">삭제</button></div><div class="flex justify-between items-end mt-2"><div><span class="font-bold text-sm text-slate-200">${log.game}</span></div><div class="text-right"><span class="text-xs text-slate-400 mr-2">${log.count}판</span><span class="font-bold text-rose-400 text-sm">${log.totalCost.toLocaleString()}원</span></div></div></div>`;
        listEl.appendChild(card);
      });
    }

    function renderNotices() {
      const container = document.getElementById('noticeList'); if (!container) return; container.innerHTML = '';
      NOTICES.forEach(notice => {
        const card = document.createElement('article'); card.className = 'bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 space-y-2';
        card.innerHTML = `<div class="flex items-center justify-between"><span class="text-xs px-2 py-0.5 rounded-md font-semibold ${notice.tagColor}">${notice.tag}</span><span class="text-xs text-slate-400 font-mono">${notice.date}</span></div><h2 class="font-bold text-slate-200 text-base">${notice.title}</h2><p class="text-xs text-slate-300 whitespace-pre-line leading-relaxed">${notice.content}</p>`;
        container.appendChild(card);
      });
    }

    function exportData() {
      if(logs.length === 0) return alert("추출할 데이터가 없습니다.");
      const dataStr = JSON.stringify({ logs }, null, 2); const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `얼마썼냥_백업_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0]; if (!file) return; const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if(imported.logs && Array.isArray(imported.logs)) {
            if (currentUser && db) { for (const item of imported.logs) { await db.collection("users").doc(currentUser.uid).collection("logs").doc(String(item.id)).set(item); } }
            else { logs = [...imported.logs, ...logs]; localStorage.setItem('rhythm_logs_v3', JSON.stringify(logs)); renderDashboard(); }
            alert("데이터 복구가 완료되었습니다.");
          }
        } catch (err) { alert("파일 읽기 오류"); }
      };
      reader.readAsText(file); event.target.value = '';
    }

    function clearAllLogs() {
      if (confirm('🚨 모든 데이터를 정말 삭제하시겠습니까?')) {
        if (currentUser && db) logs.forEach(l => db.collection("users").doc(currentUser.uid).collection("logs").doc(String(l.id)).delete());
        else { logs = []; localStorage.removeItem('rhythm_logs_v3'); renderDashboard(); }
        localStorage.removeItem('sdvx_data'); alert("초기화 되었습니다."); location.reload();
      }
    }

    function switchTab(tabId) {
      if (tabId === 'tab-profile') {
        alert('현재 전적 데이터 연동 기능은 🛠️오류 점검 및 테스트 사이트 분리 작업으로 인해 점검 중입니다.\n\n불편을 드려 죄송합니다.');
      }

      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active')); document.getElementById(tabId).classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-indigo-400'); btn.classList.add('text-slate-500'); });
      document.getElementById('btn-' + tabId).classList.add('text-indigo-400'); document.getElementById('btn-' + tabId).classList.remove('text-slate-500');
      
      if (tabId === 'tab-stats') renderStats();
      else if (tabId === 'tab-notice') renderNotices();
      else if (tabId === 'tab-input') renderDashboard();
    }
  </script>
</body>
</html>
